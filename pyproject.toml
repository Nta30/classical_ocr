[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classical-ocr-template-matching"
version = "1.0.0"
description = "Educational printed OCR using classical image processing and NumPy template matching"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
